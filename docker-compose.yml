services:
  postgres:
    image: postgres:17-alpine
    container_name: tienda-online-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tienda_online
      POSTGRES_USER: tienda_online
      POSTGRES_PASSWORD: tienda_online_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda_online -d tienda_online"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: tienda-online-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
